<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <link rel="canonical" href="https://xland.cc/" />
    <meta http-equiv="refresh" content="0; url=https://xland.cc/" />
    <script>
      window.location.replace(
        "https://xland.cc/" +
          window.location.pathname.substring(1) +
          window.location.search +
          window.location.hash,
      );
    </script>
  </head>
  <body>
    <p>Moved to <a href="https://xland.cc/">xland.cc</a></p>
  </body>
</html>
